<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Travel Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 🔑 Supabaseのキー2つだけ設定してください
    // ==========================================
    const SUPABASE_URL = 'https://xankyyjojztzubhvrfwx.supabase.co';
    const SUPABASE_KEY ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhhbmt5eWpvanp0enViaHZyZnd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwOTczMjQsImV4cCI6MjEwODY3MzMyNH0.XhjVO7tibCwP9T0RFsPYP5iBLKkx0X3ebxBqnYSIkFM';
    
    // GeminiのAPIキーは不要になったので削除しました！

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { useState, useEffect, useRef } = React;

    function TripDetail({ trip, onBack }) {
      const [activeTab, setActiveTab] = useState('schedule');
      const [schedules, setSchedules] = useState([]);
      const [items, setItems] = useState([]);
      const [memories, setMemories] = useState([]);
      
      const [newItem, setNewItem] = useState('');
      const [newSchedule, setNewSchedule] = useState({ time: '', place: '' });
      const [uploading, setUploading] = useState(false);
      const fileInputRef = useRef(null);

      const [selectedImage, setSelectedImage] = useState(null);
      const [editingScheduleId, setEditingScheduleId] = useState(null);
      const [editScheduleData, setEditScheduleData] = useState({ time: '', place: '' });

      useEffect(() => {
        fetchData();
      }, [activeTab]);

      const fetchData = async () => {
        if (activeTab === 'schedule') {
          const { data } = await supabase.from('schedules').select('*').eq('trip_id', trip.id).order('time', { ascending: true });
          setSchedules(data || []);
        } else if (activeTab === 'items') {
          const { data } = await supabase.from('items').select('*').eq('trip_id', trip.id).order('created_at', { ascending: true });
          setItems(data || []);
        } else if (activeTab === 'memories') {
          const { data } = await supabase.from('memories').select('*').eq('trip_id', trip.id).order('created_at', { ascending: false });
          setMemories(data || []);
        }
      };

      const handleAddItem = async (e) => {
        e.preventDefault();
        if (!newItem) return;
        await supabase.from('items').insert([{ trip_id: trip.id, name: newItem }]);
        setNewItem('');
        fetchData();
      };

      const toggleItem = async (id, currentStatus) => {
        await supabase.from('items').update({ is_checked: !currentStatus }).eq('id', id);
        fetchData();
      };

      const handleAddSchedule = async (e) => {
        e.preventDefault();
        if (!newSchedule.place) return;
        await supabase.from('schedules').insert([{ trip_id: trip.id, ...newSchedule }]);
        setNewSchedule({ time: '', place: '' });
        fetchData();
      };

      const deleteSchedule = async (id) => {
        if(confirm('この予定を削除しますか？')) {
          await supabase.from('schedules').delete().eq('id', id);
          fetchData();
        }
      };

      const handleUpdateSchedule = async (id) => {
        if (!editScheduleData.place) return;
        await supabase.from('schedules').update(editScheduleData).eq('id', id);
        setEditingScheduleId(null);
        fetchData();
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
        const { error: uploadError } = await supabase.storage.from('trip-photos').upload(fileName, file);
        if (uploadError) {
          alert('アップロード失敗: ' + uploadError.message);
          setUploading(false);
          return;
        }
        const { data: { publicUrl } } = supabase.storage.from('trip-photos').getPublicUrl(fileName);
        await supabase.from('memories').insert([{ trip_id: trip.id, image_url: publicUrl }]);
        setUploading(false);
        fetchData();
      };

      const handleShare = () => {
        if (navigator.share) {
          navigator.share({ title: trip.title, text: '家族旅行のしおりです！', url: window.location.href })
            .catch(console.error);
        } else {
          navigator.clipboard.writeText(window.location.href);
          alert('URLをコピーしました！LINEなどに貼り付けて共有できます。');
        }
      };

      return (
        <div className="max-w-4xl mx-auto bg-white h-[100dvh] flex flex-col shadow-xl">
          
          <div className="bg-gradient-to-r from-blue-500 to-indigo-500 text-white p-4 flex items-center justify-between shrink-0">
            <button onClick={onBack} className="hover:bg-white/20 p-2 rounded-full"><i className="fa-solid fa-chevron-left text-xl"></i></button>
            <h1 className="text-lg font-bold truncate">{trip.title}</h1>
            <button onClick={handleShare} className="hover:bg-white/20 p-2 rounded-full" title="家族に共有する"><i className="fa-solid fa-share-nodes text-xl"></i></button>
          </div>

          <div className="flex border-b text-sm font-medium bg-white shrink-0">
            {[
              { id: 'schedule', icon: 'fa-calendar-days', label: '日程' },
              { id: 'items', icon: 'fa-suitcase', label: '持ち物' },
              { id: 'memories', icon: 'fa-image', label: '思い出' },
              { id: 'ai', icon: 'fa-lightbulb', label: 'アイデア' }
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 py-3 text-center transition ${activeTab === tab.id ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:bg-gray-50'}`}>
                <i className={`fa-solid ${tab.icon} block mb-1 text-lg`}></i>{tab.label}
              </button>
            ))}
          </div>

          <div className="flex-1 overflow-y-auto bg-gray-50 p-4">
            
            {activeTab === 'schedule' && (
              <div className="max-w-xl mx-auto pb-6">
                <form onSubmit={handleAddSchedule} className="bg-white p-4 rounded-xl shadow-sm flex gap-2 mb-6">
                  <input type="time" value={newSchedule.time} onChange={e => setNewSchedule({...newSchedule, time: e.target.value})} className="border rounded p-2 text-sm" />
                  <input type="text" placeholder="場所・予定" value={newSchedule.place} onChange={e => setNewSchedule({...newSchedule, place: e.target.value})} className="border rounded p-2 text-sm flex-1" required />
                  <button type="submit" className="bg-blue-600 text-white px-4 rounded font-bold"><i className="fa-solid fa-plus"></i></button>
                </form>
                
                <div className="border-l-2 border-blue-200 ml-4 space-y-4">
                  {schedules.map(sch => (
                    <div key={sch.id} className="relative pl-6">
                      <div className="absolute -left-[9px] top-4 w-4 h-4 rounded-full bg-blue-500 ring-4 ring-gray-50"></div>
                      <div className="bg-white p-3 rounded-lg shadow-sm border border-gray-100">
                        {editingScheduleId === sch.id ? (
                          <div className="flex flex-col gap-2">
                            <input type="time" value={editScheduleData.time} onChange={e => setEditScheduleData({...editScheduleData, time: e.target.value})} className="border rounded p-1" />
                            <input type="text" value={editScheduleData.place} onChange={e => setEditScheduleData({...editScheduleData, place: e.target.value})} className="border rounded p-1" />
                            <div className="flex justify-end gap-2 mt-2">
                              <button onClick={() => setEditingScheduleId(null)} className="text-gray-500 px-3 py-1 bg-gray-100 rounded">キャンセル</button>
                              <button onClick={() => handleUpdateSchedule(sch.id)} className="text-white px-3 py-1 bg-blue-600 rounded">保存</button>
                            </div>
                          </div>
                        ) : (
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="text-blue-600 font-bold text-sm">{sch.time || '時間未定'}</span>
                              <h3 className="font-bold text-gray-800">{sch.place}</h3>
                            </div>
                            <div className="flex gap-3 text-gray-400">
                              <button onClick={() => { setEditingScheduleId(sch.id); setEditScheduleData({ time: sch.time, place: sch.place }); }}><i className="fa-solid fa-pen"></i></button>
                              <button onClick={() => deleteSchedule(sch.id)} className="hover:text-red-500"><i className="fa-solid fa-trash"></i></button>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'items' && (
              <div className="max-w-xl mx-auto space-y-4 pb-6">
                <form onSubmit={handleAddItem} className="flex gap-2">
                  <input type="text" placeholder="持ち物を追加" value={newItem} onChange={e => setNewItem(e.target.value)} className="flex-1 border rounded-lg px-4 py-3" />
                  <button type="submit" className="bg-blue-600 text-white px-4 rounded-lg font-bold">追加</button>
                </form>
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                  {items.map(item => (
                    <div key={item.id} onClick={() => toggleItem(item.id, item.is_checked)} className="flex items-center p-4 border-b cursor-pointer hover:bg-gray-50">
                      <div className={`w-6 h-6 rounded-full flex items-center justify-center mr-3 border ${item.is_checked ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300'}`}>
                        {item.is_checked && <i className="fa-solid fa-check text-xs"></i>}
                      </div>
                      <span className={`flex-1 ${item.is_checked ? 'text-gray-400 line-through' : 'text-gray-800'}`}>{item.name}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'memories' && (
              <div className="space-y-4 pb-6">
                <div className="text-center mb-6">
                  <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageUpload} className="hidden" />
                  <button onClick={() => fileInputRef.current.click()} disabled={uploading} className="bg-blue-600 text-white px-6 py-3 rounded-full font-bold shadow-lg">
                    <i className="fa-solid fa-camera mr-2"></i> {uploading ? 'アップロード中...' : '写真を追加'}
                  </button>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                  {memories.map(mem => (
                    <div key={mem.id} onClick={() => setSelectedImage(mem.image_url)} className="aspect-square bg-gray-200 rounded-lg overflow-hidden cursor-pointer hover:opacity-80 transition">
                      <img src={mem.image_url} alt="思い出" className="w-full h-full object-cover" />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 新しい「アイデア」タブ（外部AIへのリンク集） */}
            {activeTab === 'ai' && (
              <div className="max-w-xl mx-auto space-y-6 pb-6">
                <div className="bg-blue-50 text-blue-800 p-4 rounded-xl text-sm">
                  <i className="fa-solid fa-circle-info mr-2"></i>
                  行き先や持ち物のアイデアが欲しい時は、お好きなAIに直接相談してみましょう！
                </div>
                
                <a href="https://gemini.google.com/app" target="_blank" className="block bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition text-center flex items-center justify-center gap-3">
                  <i className="fa-brands fa-google text-2xl text-blue-500"></i>
                  <div className="text-left">
                    <div className="font-bold text-gray-800">Google Gemini に相談</div>
                    <div className="text-xs text-gray-500">Googleアカウントで使えます</div>
                  </div>
                </a>

                <a href="https://chatgpt.com/" target="_blank" className="block bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition text-center flex items-center justify-center gap-3">
                  <i className="fa-solid fa-robot text-2xl text-green-600"></i>
                  <div className="text-left">
                    <div className="font-bold text-gray-800">ChatGPT に相談</div>
                    <div className="text-xs text-gray-500">おなじみのAIアシスタント</div>
                  </div>
                </a>
              </div>
            )}
          </div>
          
          {selectedImage && (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onClick={() => setSelectedImage(null)}>
              <img src={selectedImage} alt="拡大" className="max-w-full max-h-full object-contain" />
              <button className="absolute top-4 right-4 text-white text-3xl p-4"><i className="fa-solid fa-xmark"></i></button>
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [trips, setTrips] = useState([]);
      const [currentTrip, setCurrentTrip] = useState(null);
      const [newTripTitle, setNewTripTitle] = useState('');

      useEffect(() => { fetchTrips(); }, []);

      const fetchTrips = async () => {
        const { data } = await supabase.from('trips').select('*').order('created_at', { ascending: false });
        setTrips(data || []);
      };

      const addTrip = async (e) => {
        e.preventDefault();
        if (!newTripTitle) return;
        await supabase.from('trips').insert([{ title: newTripTitle }]);
        setNewTripTitle('');
        fetchTrips();
      };

      if (currentTrip) return <TripDetail trip={currentTrip} onBack={() => setCurrentTrip(null)} />;

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          <h1 className="text-2xl font-bold text-gray-800 mb-8"><i className="fa-solid fa-plane-departure text-blue-600 mr-2"></i> 家族の旅行一覧</h1>
          <form onSubmit={addTrip} className="bg-white p-4 rounded-xl shadow-sm mb-8 flex gap-2">
            <input type="text" placeholder="新しい旅行 (例: 沖縄旅行)" className="flex-1 border rounded-lg px-4 py-2" value={newTripTitle} onChange={e => setNewTripTitle(e.target.value)} />
            <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">追加</button>
          </form>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {trips.map(trip => (
              <div key={trip.id} onClick={() => setCurrentTrip(trip)} className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500 cursor-pointer">
                <h2 className="text-xl font-bold mb-2">{trip.title}</h2>
                <div className="mt-4 text-right text-blue-600 text-sm font-bold">しおりを開く →</div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
