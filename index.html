<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Travel Planner</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel (ブラウザでReactを動かすための翻訳機) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
  
  <!-- アプリが表示される場所 -->
  <div id="root"></div>

  <script type="text/babel">
    // ---------------------------------------------
    // 【設定エリア】あとでここにAPIキーなどを入れます
    // ---------------------------------------------
    const SUPABASE_URL = 'あなたのSupabaseのURL';
    const SUPABASE_KEY = 'あなたのSupabaseのAPIキー';
    const GEMINI_API_KEY = 'あなたのGeminiのAPIキー';

    // ---------------------------------------------
    // アプリの画面構成（Reactコンポーネント）
    // ---------------------------------------------
    function App() {
      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          <div className="bg-white rounded-2xl shadow-xl overflow-hidden text-center p-12 mt-10">
            <h1 className="text-3xl font-bold text-gray-800 mb-4">🚀 アプリの土台が完成しました！</h1>
            <p className="text-gray-600 mb-6">
              React、Tailwind CSS、Supabaseの準備がすべて整った状態の <code>index.html</code> です。<br />
              次はここに、取得した「APIキー」を設定し、プロトタイプのデザインを組み込んでいきます。
            </p>
            <div className="inline-block bg-blue-50 text-blue-700 px-4 py-2 rounded-lg font-medium border border-blue-200">
              公開URLにアクセスして、この画面が表示されていれば大成功です！
            </div>
          </div>
        </div>
      );
    }

    // 画面にアプリを描画する
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
