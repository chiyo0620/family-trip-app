<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Travel Planner</title>

  <link rel="icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="旅行しおり">

  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    const SUPABASE_URL = 'https://xankyyjojztzubhvrfwx.supabase.co';
    const SUPABASE_KEY ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhhbmt5eWpvanp0enViaHZyZnd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwOTczMjQsImV4cCI6MjEwODY3MzMyNH0.XhjVO7tibCwP9T0RFsPYP5iBLKkx0X3ebxBqnYSIkFM';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { useState, useEffect, useRef } = React;

    const DAY_THEMES = [
      { badge: 'bg-blue-600 text-white', dot: 'bg-blue-500', line: 'border-blue-200', text: 'text-blue-600' },
      { badge: 'bg-emerald-600 text-white', dot: 'bg-emerald-500', line: 'border-emerald-200', text: 'text-emerald-600' },
      { badge: 'bg-amber-500 text-white', dot: 'bg-amber-500', line: 'border-amber-200', text: 'text-amber-600' },
      { badge: 'bg-purple-600 text-white', dot: 'bg-purple-500', line: 'border-purple-200', text: 'text-purple-600' },
      { badge: 'bg-rose-500 text-white', dot: 'bg-rose-500', line: 'border-rose-200', text: 'text-rose-600' }
    ];
    const getDayTheme = (dayNum) => DAY_THEMES[(Math.max(1, dayNum) - 1) % DAY_THEMES.length];

    const formatDate = (startDateStr, dayNum) => {
      if (!startDateStr) return '';
      const date = new Date(startDateStr);
      date.setDate(date.getDate() + (dayNum - 1));
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      return `${month}/${day}(${weekdays[date.getDay()]})`;
    };

    // ①【新規作成用】の指示文（出発日が入力されていればAIに伝える）
    const getNewPrompt = (startDate) => `これまでの旅行相談の内容をもとに、旅行しおりアプリに取り込むためのデータを出力してください。
${startDate ? `【重要】旅行の1日目（出発日）は「${startDate}」です。この日付を基準に考えてください。\n` : ''}
必ず以下のJSONフォーマットのみを出力してください。前後の挨拶や補足文は不要です。

{
  "title": "旅行タイトル（例: 沖縄3泊4日の家族旅行）",
  "schedules": [
    {"day": 1, "time": "10:00", "place": "那覇空港到着", "memo": "レンタカー受付へ直行"},
    {"day": 2, "time": "09:30", "place": "古宇利大橋ドライブ", "memo": ""}
  ],
  "items": [
    "着替え", "保険証"
  ]
}`;

    // ②【後から追加用】の指示文（★出発日を基準にした日数計算の指示を追加！）
    const getAddPrompt = (startDate) => `提供する情報（予約メール本文やスクショなど）をもとに、旅行しおりアプリに後から追加するためのデータを出力してください。
${startDate ? `【重要】この旅行の1日目（出発日）は「${startDate}」です。提供されたメールやスクショの日付（例：11月22日）が、この出発日を基準に「何日目(day)」にあたるかを正確に計算し、"day" の数値に反映してください。\n` : ''}
必ず以下のJSONフォーマットのみを出力してください。前後の挨拶や補足文は不要です。

{
  "schedules": [
    {"day": 3, "time": "15:00", "place": "〇〇ホテル チェックイン", "memo": "予約番号: 12345"}
  ],
  "items": [
    "水着", "浮き輪"
  ]
}`;

    // ==========================================
    // しおり詳細画面
    // ==========================================
    function TripDetail({ trip, onBack }) {
      const [activeTab, setActiveTab] = useState('schedule');
      const [schedules, setSchedules] = useState([]);
      const [items, setItems] = useState([]);
      const [memories, setMemories] = useState([]);
      
      const [newItem, setNewItem] = useState('');
      const [uploading, setUploading] = useState(false);
      const fileInputRef = useRef(null);
      const [selectedImage, setSelectedImage] = useState(null);

      const [showAddModal, setShowAddModal] = useState(false);
      const [newSchedule, setNewSchedule] = useState({ day: 1, time: '', place: '', memo: '' });
      
      const [editingScheduleId, setEditingScheduleId] = useState(null);
      const [editScheduleData, setEditScheduleData] = useState({ day: 1, time: '', place: '', memo: '' });

      const [importAddText, setImportAddText] = useState('');
      const [isImportingAdd, setIsImportingAdd] = useState(false);

      useEffect(() => { fetchData(); }, [activeTab]);

      const fetchData = async () => {
        if (activeTab === 'schedule') {
          const { data } = await supabase.from('schedules').select('*').eq('trip_id', trip.id).order('day').order('time');
          setSchedules(data || []);
        } else if (activeTab === 'items') {
          const { data } = await supabase.from('items').select('*').eq('trip_id', trip.id).order('created_at');
          setItems(data || []);
        } else if (activeTab === 'memories') {
          const { data } = await supabase.from('memories').select('*').eq('trip_id', trip.id).order('created_at', { ascending: false });
          setMemories(data || []);
        }
      };

      const handleAddItem = async (e) => {
        e.preventDefault();
        if (!newItem) return;
        await supabase.from('items').insert([{ trip_id: trip.id, name: newItem }]);
        setNewItem('');
        fetchData();
      };
      const toggleItem = async (id, currentStatus) => {
        await supabase.from('items').update({ is_checked: !currentStatus }).eq('id', id);
        fetchData();
      };

      const handleAddSchedule = async (e) => {
        e.preventDefault();
        if (!newSchedule.place) return;
        await supabase.from('schedules').insert([{ 
          trip_id: trip.id, day: Number(newSchedule.day) || 1, time: newSchedule.time, place: newSchedule.place, memo: newSchedule.memo 
        }]);
        setNewSchedule({ ...newSchedule, time: '', place: '', memo: '' });
        setShowAddModal(false);
        fetchData();
      };

      const deleteSchedule = async (id) => {
        if(confirm('予定を削除しますか？')) {
          await supabase.from('schedules').delete().eq('id', id);
          fetchData();
        }
      };

      const handleUpdateSchedule = async (id) => {
        if (!editScheduleData.place) return;
        await supabase.from('schedules').update({
          day: Number(editScheduleData.day) || 1, time: editScheduleData.time, place: editScheduleData.place, memo: editScheduleData.memo
        }).eq('id', id);
        setEditingScheduleId(null);
        fetchData();
      };

      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
        const { error: uploadError } = await supabase.storage.from('trip-photos').upload(fileName, file);
        if (uploadError) { alert('失敗: ' + uploadError.message); setUploading(false); return; }
        const { data: { publicUrl } } = supabase.storage.from('trip-photos').getPublicUrl(fileName);
        await supabase.from('memories').insert([{ trip_id: trip.id, image_url: publicUrl }]);
        setUploading(false);
        fetchData();
      };

      const handleShare = () => {
        if (navigator.share) {
          navigator.share({ title: trip.title, text: '家族旅行のしおりです！', url: window.location.href }).catch(console.error);
        } else {
          navigator.clipboard.writeText(window.location.href);
          alert('URLをコピーしました！LINEなどに貼り付けて共有できます。');
        }
      };

      const handleImportAddPlan = async () => {
        if (!importAddText.trim()) return;
        setIsImportingAdd(true);

        try {
          const jsonMatch = importAddText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('有効なデータが見つかりませんでした。');
          const parsed = JSON.parse(jsonMatch[0]);

          let addedSchedules = 0;
          let addedItems = 0;

          if (parsed.schedules && parsed.schedules.length > 0) {
            const scheduleRecords = parsed.schedules.map(s => ({ 
              trip_id: trip.id, day: Number(s.day) || 1, time: s.time || '', place: s.place || '', memo: s.memo || '' 
            }));
            await supabase.from('schedules').insert(scheduleRecords);
            addedSchedules = scheduleRecords.length;
          }

          if (parsed.items && parsed.items.length > 0) {
            const itemRecords = parsed.items.map(name => ({ 
              trip_id: trip.id, name: typeof name === 'string' ? name : (name.name || ''), is_checked: false 
            }));
            await supabase.from('items').insert(itemRecords);
            addedItems = itemRecords.length;
          }

          alert(`予定を${addedSchedules}件、持ち物を${addedItems}件追加しました！\n日程・持ち物タブで確認してください。`);
          setImportAddText('');
          fetchData();
        } catch (err) {
          alert('追加に失敗しました: ' + err.message);
        } finally {
          setIsImportingAdd(false);
        }
      };

      const groupedSchedules = schedules.reduce((acc, sch) => {
        const d = sch.day || 1;
        if (!acc[d]) acc[d] = [];
        acc[d].push(sch);
        return acc;
      }, {});

      return (
        <div className="max-w-4xl mx-auto bg-white h-[100dvh] flex flex-col shadow-xl relative">
          <div className="bg-gradient-to-r from-blue-500 to-indigo-500 text-white p-4 flex items-center justify-between shrink-0">
            <button onClick={onBack} className="hover:bg-white/20 p-2 rounded-full"><i className="fa-solid fa-chevron-left text-xl"></i></button>
            <div className="text-center">
              <h1 className="text-lg font-bold truncate leading-tight">{trip.title}</h1>
              {trip.start_date && <div className="text-xs text-blue-100">{formatDate(trip.start_date, 1)}出発</div>}
            </div>
            <button onClick={handleShare} className="hover:bg-white/20 p-2 rounded-full"><i className="fa-solid fa-share-nodes text-xl"></i></button>
          </div>

          <div className="flex border-b text-sm font-medium bg-white shrink-0">
            {[{ id: 'schedule', icon: 'fa-calendar-days', label: '日程' }, { id: 'items', icon: 'fa-suitcase', label: '持ち物' }, { id: 'memories', icon: 'fa-image', label: '思い出' }, { id: 'ai', icon: 'fa-wand-magic-sparkles', label: 'AI連携' }].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 py-3 text-center transition ${activeTab === tab.id ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:bg-gray-50'}`}>
                <i className={`fa-solid ${tab.icon} block mb-1 text-lg`}></i>{tab.label}
              </button>
            ))}
          </div>

          <div className="flex-1 overflow-y-auto bg-gray-50 p-4 relative pb-24">
            {activeTab === 'schedule' && (
              <div className="max-w-xl mx-auto space-y-6">
                {Object.keys(groupedSchedules).length > 0 ? (
                  Object.keys(groupedSchedules).sort((a,b) => Number(a) - Number(b)).map(dayKey => {
                    const dayNum = Number(dayKey);
                    const theme = getDayTheme(dayNum);
                    const dateStr = formatDate(trip.start_date, dayNum);

                    return (
                      <div key={dayKey} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                        <div className="flex items-center gap-2 mb-4 pb-2 border-b">
                          <span className={`${theme.badge} text-xs font-bold px-3 py-1 rounded-full shadow-sm`}>
                            {dayNum}日目 {dateStr && <span className="ml-1 opacity-90 font-normal">{dateStr}</span>}
                          </span>
                        </div>
                        <div className={`relative border-l-2 ${theme.line} ml-3 space-y-4`}>
                          {groupedSchedules[dayKey].map(sch => (
                            <div key={sch.id} className="relative pl-5">
                              <div className={`absolute -left-[7px] top-3.5 w-3 h-3 rounded-full ${theme.dot} ring-4 ring-white`}></div>
                              <div className="bg-gray-50 p-3 rounded-xl border border-gray-100">
                                {editingScheduleId === sch.id ? (
                                  <div className="flex flex-col gap-2">
                                    <div className="flex gap-2">
                                      <select value={editScheduleData.day} onChange={e => setEditScheduleData({...editScheduleData, day: e.target.value})} className="border rounded p-1 text-xs">
                                        {[1,2,3,4,5,6,7].map(d => <option key={d} value={d}>{d}日目</option>)}
                                      </select>
                                      <input type="time" value={editScheduleData.time} onChange={e => setEditScheduleData({...editScheduleData, time: e.target.value})} className="border rounded p-1 text-xs" />
                                    </div>
                                    <input type="text" value={editScheduleData.place} onChange={e => setEditScheduleData({...editScheduleData, place: e.target.value})} className="border rounded p-1 text-sm font-bold" />
                                    <textarea value={editScheduleData.memo || ''} onChange={e => setEditScheduleData({...editScheduleData, memo: e.target.value})} placeholder="メモ (任意)" className="border rounded p-1 text-sm" rows="2"></textarea>
                                    <div className="flex justify-end gap-2 mt-1">
                                      <button onClick={() => setEditingScheduleId(null)} className="text-xs text-gray-500 px-3 py-1 bg-white border rounded">キャンセル</button>
                                      <button onClick={() => handleUpdateSchedule(sch.id)} className="text-xs text-white px-3 py-1 bg-blue-600 rounded font-bold">更新</button>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="flex justify-between items-start">
                                    <div className="flex-1">
                                      <span className={`${theme.text} font-bold text-xs`}>{sch.time || '時間未定'}</span>
                                      <h3 className="font-bold text-gray-800 text-sm mt-0.5">{sch.place}</h3>
                                      {sch.memo && <p className="text-xs text-gray-500 mt-1.5 whitespace-pre-wrap bg-white p-2 rounded border border-gray-100">{sch.memo}</p>}
                                    </div>
                                    <div className="flex gap-3 text-gray-400 text-xs mt-1 ml-2">
                                      <button onClick={() => { setEditingScheduleId(sch.id); setEditScheduleData({ day: sch.day || 1, time: sch.time, place: sch.place, memo: sch.memo }); }}><i className="fa-solid fa-pen hover:text-gray-600"></i></button>
                                      <button onClick={() => deleteSchedule(sch.id)} className="hover:text-red-500"><i className="fa-solid fa-trash"></i></button>
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })
                ) : (
                  <p className="text-gray-400 text-center py-10 text-sm">予定がありません。<br/>右下の「＋」ボタンから追加してください。</p>
                )}
              </div>
            )}

            {activeTab === 'items' && (
              <div className="max-w-xl mx-auto pb-6">
                <form onSubmit={handleAddItem} className="flex gap-2 mb-4"><input type="text" placeholder="持ち物を追加" value={newItem} onChange={e => setNewItem(e.target.value)} className="flex-1 border rounded-lg px-4 py-3 text-sm" /><button type="submit" className="bg-blue-600 text-white px-5 rounded-lg font-bold text-sm">追加</button></form>
                <div className="bg-white rounded-xl shadow-sm border overflow-hidden">{items.map(item => (<div key={item.id} onClick={() => toggleItem(item.id, item.is_checked)} className="flex items-center p-4 border-b cursor-pointer hover:bg-gray-50"><div className={`w-6 h-6 rounded-full flex items-center justify-center mr-3 border ${item.is_checked ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300'}`}>{item.is_checked && <i className="fa-solid fa-check text-xs"></i>}</div><span className={`flex-1 text-sm ${item.is_checked ? 'text-gray-400 line-through' : 'text-gray-800'}`}>{item.name}</span></div>))}</div>
              </div>
            )}

            {activeTab === 'memories' && (
              <div className="max-w-xl mx-auto pb-6">
                <div className="text-center mb-6"><input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageUpload} className="hidden" /><button onClick={() => fileInputRef.current.click()} disabled={uploading} className="bg-blue-600 text-white px-6 py-3 rounded-full font-bold shadow-lg"><i className="fa-solid fa-camera mr-2"></i> {uploading ? 'アップロード中...' : '写真を追加'}</button></div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">{memories.map(mem => (<div key={mem.id} onClick={() => setSelectedImage(mem.image_url)} className="aspect-square bg-gray-200 rounded-lg overflow-hidden cursor-pointer hover:opacity-80"><img src={mem.image_url} alt="思い出" className="w-full h-full object-cover" /></div>))}</div>
              </div>
            )}

            {activeTab === 'ai' && (
              <div className="max-w-xl mx-auto space-y-6 pb-6">
                <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-sm text-indigo-900 leading-relaxed">
                  <h3 className="font-bold mb-2 flex items-center gap-2 text-indigo-700">
                    <i className="fa-solid fa-wand-magic-sparkles"></i> AIで手入力ゼロ体験
                  </h3>
                  <p className="mb-2 font-medium text-xs">ホテルの予約メールやチケットのスクショをGeminiに読み込ませて、しおりに予定を自動追加できます。</p>
                  <ol className="list-decimal list-inside space-y-1 text-xs text-indigo-800 mt-2">
                    <li>下のボタンで「追加用指示文」をコピー</li>
                    <li>Geminiを開き、指示文と <span className="font-bold">メール本文（またはスクショ画像）</span> を一緒に送信</li>
                    <li>返ってきたコードを下の枠に貼り付けて取り込む</li>
                  </ol>
                  <div className="mt-3 flex gap-2">
                    <button 
                      onClick={() => { 
                        navigator.clipboard.writeText(getAddPrompt(trip.start_date)); 
                        alert('追加用の指示文をコピーしました！\n「出発日を基準にした日数計算」の指示も含まれています。'); 
                      }} 
                      className="text-xs bg-indigo-600 text-white font-bold px-3 py-2.5 rounded-lg shadow hover:bg-indigo-700 flex-1 flex items-center justify-center gap-1 transition"
                    >
                      <i className="fa-solid fa-copy"></i> 指示文コピー
                    </button>
                    <a href="https://gemini.google.com/app" target="_blank" className="text-xs bg-white border border-indigo-200 text-indigo-700 font-bold px-3 py-2.5 rounded-lg hover:bg-indigo-100 flex-1 flex items-center justify-center gap-1 transition text-center">
                       Geminiを開く ↗
                    </a>
                  </div>
                </div>
                <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
                  <label className="block text-sm font-bold text-gray-800">
                    <i className="fa-solid fa-file-import text-blue-500 mr-1"></i> 追加データを取り込む
                  </label>
                  <textarea 
                    rows="5" 
                    value={importAddText} 
                    onChange={e => setImportAddText(e.target.value)}
                    placeholder='{"schedules": [{"day": 3, "time": "15:00", "place": "ホテル"}], ...}'
                    className="w-full border rounded-lg p-2.5 text-xs font-mono focus:ring-2 focus:ring-blue-400 focus:outline-none bg-gray-50"
                  ></textarea>
                  <button 
                    onClick={handleImportAddPlan} 
                    disabled={isImportingAdd || !importAddText.trim()}
                    className="w-full bg-blue-600 text-white font-bold p-3 rounded-lg shadow hover:bg-blue-700 transition disabled:opacity-50 flex items-center justify-center gap-2"
                  >
                    {isImportingAdd ? <><i className="fa-solid fa-spinner fa-spin"></i> 追加中...</> : <><i className="fa-solid fa-plus"></i> しおりに追加する</>}
                  </button>
                </div>
              </div>
            )}
          </div>

          {activeTab === 'schedule' && (
            <button 
              onClick={() => setShowAddModal(true)}
              className="absolute bottom-6 right-6 w-14 h-14 bg-blue-600 text-white rounded-full shadow-xl flex items-center justify-center text-2xl hover:bg-blue-700 hover:scale-105 transition-transform z-10"
            >
              <i className="fa-solid fa-plus"></i>
            </button>
          )}

          {showAddModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
                <h3 className="font-bold text-gray-800 text-lg mb-4 flex items-center gap-2">
                  <i className="fa-solid fa-calendar-plus text-blue-600"></i> 新しい予定
                </h3>
                <form onSubmit={handleAddSchedule} className="space-y-4">
                  <div className="flex gap-2">
                    <select value={newSchedule.day} onChange={e => setNewSchedule({...newSchedule, day: e.target.value})} className="border rounded-lg p-2.5 text-sm flex-1 bg-gray-50 focus:ring-2 focus:ring-blue-400">
                      {[1,2,3,4,5,6,7].map(d => <option key={d} value={d}>{d}日目</option>)}
                    </select>
                    <input type="time" value={newSchedule.time} onChange={e => setNewSchedule({...newSchedule, time: e.target.value})} className="border rounded-lg p-2.5 text-sm flex-1 bg-gray-50 focus:ring-2 focus:ring-blue-400" />
                  </div>
                  <input type="text" placeholder="場所・予定を入力" value={newSchedule.place} onChange={e => setNewSchedule({...newSchedule, place: e.target.value})} className="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none" required />
                  <textarea placeholder="メモ (チケット番号、持ち物、予約名など)" value={newSchedule.memo} onChange={e => setNewSchedule({...newSchedule, memo: e.target.value})} className="w-full border rounded-lg p-3 text-sm focus:ring-2 focus:ring-blue-400 focus:outline-none bg-gray-50" rows="3"></textarea>
                  <div className="flex justify-end gap-3 pt-2">
                    <button type="button" onClick={() => setShowAddModal(false)} className="px-5 py-2.5 text-sm font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 rounded-xl transition">キャンセル</button>
                    <button type="submit" className="px-5 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl shadow-md transition">保存する</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {selectedImage && (<div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onClick={() => setSelectedImage(null)}><img src={selectedImage} alt="拡大" className="max-w-full max-h-full object-contain" /><button className="absolute top-4 right-4 text-white text-3xl p-4"><i className="fa-solid fa-xmark"></i></button></div>)}
        </div>
      );
    }

    // ==========================================
    // メイン（一覧画面 ＆ AIプラン一括作成）
    // ==========================================
    function App() {
      const [trips, setTrips] = useState([]);
      const [currentTrip, setCurrentTrip] = useState(null);
      
      const [newTripTitle, setNewTripTitle] = useState('');
      const [newTripDate, setNewTripDate] = useState('');

      const [showImportModal, setShowImportModal] = useState(false);
      const [importDataText, setImportDataText] = useState('');
      const [isImporting, setIsImporting] = useState(false);

      useEffect(() => { fetchTrips(); }, []);

      const fetchTrips = async () => {
        const { data } = await supabase.from('trips').select('*').order('created_at', { ascending: false });
        setTrips(data || []);
      };

      const addTrip = async (e) => {
        e.preventDefault();
        if (!newTripTitle) return;
        await supabase.from('trips').insert([{ title: newTripTitle, start_date: newTripDate || null }]);
        setNewTripTitle('');
        setNewTripDate('');
        fetchTrips();
      };

      const deleteTrip = async (e, tripId, tripTitle) => {
        e.stopPropagation();
        if (!confirm(`「${tripTitle}」を完全に削除しますか？\n※この操作は取り消せません。`)) return;
        try {
          await supabase.from('schedules').delete().eq('trip_id', tripId);
          await supabase.from('items').delete().eq('trip_id', tripId);
          await supabase.from('memories').delete().eq('trip_id', tripId);
          await supabase.from('trips').delete().eq('id', tripId);
          fetchTrips();
        } catch (err) {
          alert('削除エラー: ' + err.message);
        }
      };

      const handleImportPlan = async () => {
        if (!importDataText.trim()) return;
        setIsImporting(true);
        try {
          const jsonMatch = importDataText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('有効なデータが見つかりませんでした。');
          const parsed = JSON.parse(jsonMatch[0]);
          if (!parsed.title) throw new Error('旅行タイトルが含まれていません。');

          const { data: tripData, error: tripErr } = await supabase.from('trips').insert([{ title: parsed.title, start_date: newTripDate || null }]).select().single();
          if (tripErr) throw tripErr;

          const tripId = tripData.id;
          if (parsed.schedules && parsed.schedules.length > 0) {
            const scheduleRecords = parsed.schedules.map(s => ({ trip_id: tripId, day: Number(s.day) || 1, time: s.time || '', place: s.place || '', memo: s.memo || '' }));
            await supabase.from('schedules').insert(scheduleRecords);
          }
          if (parsed.items && parsed.items.length > 0) {
            const itemRecords = parsed.items.map(name => ({ trip_id: tripId, name: typeof name === 'string' ? name : (name.name || ''), is_checked: false }));
            await supabase.from('items').insert(itemRecords);
          }

          alert(`「${parsed.title}」を作成しました！`);
          setImportDataText('');
          setShowImportModal(false);
          await fetchTrips();
          setCurrentTrip(tripData);
        } catch (err) {
          alert('エラー: ' + err.message);
        } finally {
          setIsImporting(false);
        }
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          <div className="flex items-center justify-between mb-8">
            <h1 className="text-2xl font-bold text-gray-800">
              <i className="fa-solid fa-plane-departure text-blue-600 mr-2"></i> 家族の旅行一覧
            </h1>
            <button 
              onClick={() => setShowImportModal(true)} 
              className="bg-indigo-600 text-white text-sm font-bold px-4 py-2 rounded-xl shadow hover:bg-indigo-700 transition flex items-center gap-2"
            >
              <i className="fa-solid fa-wand-magic-sparkles"></i> AIプラン新規作成
            </button>
          </div>
          
          <form onSubmit={addTrip} className="bg-white p-5 rounded-xl shadow-sm mb-8 flex flex-col sm:flex-row gap-3">
            <input type="text" placeholder="旅行のタイトル (例: 沖縄旅行)" className="flex-1 border rounded-lg px-4 py-3 text-sm focus:ring-2 focus:ring-blue-400" value={newTripTitle} onChange={e => setNewTripTitle(e.target.value)} required />
            <div className="flex gap-3">
              <input type="date" className="border rounded-lg px-4 py-3 text-sm text-gray-600 focus:ring-2 focus:ring-blue-400" value={newTripDate} onChange={e => setNewTripDate(e.target.value)} title="出発日" />
              <button type="submit" className="bg-blue-600 text-white px-6 py-3 rounded-lg font-bold shadow hover:bg-blue-700 whitespace-nowrap">追加</button>
            </div>
          </form>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {trips.map(trip => (
              <div key={trip.id} className="bg-white rounded-xl shadow-sm border-l-4 border-blue-500 hover:shadow-md transition relative group overflow-hidden">
                <button 
                  onClick={(e) => deleteTrip(e, trip.id, trip.title)} 
                  className="absolute top-3 right-3 z-10 text-gray-300 hover:text-red-500 w-10 h-10 flex items-center justify-center transition-colors rounded-full hover:bg-red-50" 
                  title="旅行を削除"
                >
                  <i className="fa-solid fa-trash text-lg"></i>
                </button>
                <div onClick={() => setCurrentTrip(trip)} className="p-6 cursor-pointer">
                  <h2 className="text-xl font-bold mb-1 pr-12">{trip.title}</h2>
                  {trip.start_date && (
                    <p className="text-sm text-gray-500 mb-2">
                      <i className="fa-regular fa-calendar mr-1"></i>{trip.start_date} 出発
                    </p>
                  )}
                  <div className="mt-4 text-right text-blue-600 text-sm font-bold">しおりを開く →</div>
                </div>
              </div>
            ))}
          </div>

          {showImportModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center shrink-0">
                  <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i className="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> AIプラン新規作成
                  </h2>
                  <button onClick={() => setShowImportModal(false)} className="text-gray-400 hover:text-gray-600 text-xl">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <div className="flex-1 overflow-y-auto space-y-3 text-sm">
                  <div className="bg-gray-50 border p-3 rounded-lg text-gray-600 space-y-2">
                    <ol className="list-decimal list-inside space-y-1 text-xs">
                      <li>Geminiで旅行の相談をする</li>
                      <li>下のボタンで指示文をコピーしてGeminiに送る</li>
                      <li>Geminiが返したJSONコードを貼り付ける</li>
                    </ol>
                    <div className="pt-1 flex gap-2">
                      <button onClick={() => { navigator.clipboard.writeText(getNewPrompt(newTripDate)); alert('新規作成用の指示文をコピーしました！\n出発日の情報も含まれています。'); }} className="text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded hover:bg-indigo-200">
                        <i className="fa-solid fa-copy mr-1"></i> 指示文をコピー
                      </button>
                      <a href="https://gemini.google.com/app" target="_blank" className="text-xs bg-gray-200 text-gray-700 font-bold px-3 py-1.5 rounded hover:bg-gray-300">
                        Geminiを開く ↗
                      </a>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Geminiの返答コードを貼り付け：</label>
                    <textarea 
                      rows="6" value={importDataText} onChange={e => setImportDataText(e.target.value)}
                      placeholder='{"title": "沖縄3泊4日", "schedules": [...], ...}'
                      className="w-full border rounded-lg p-2.5 text-xs font-mono focus:ring-2 focus:ring-indigo-400 focus:outline-none"
                    ></textarea>
                  </div>
                  <div>
                     <label className="block text-xs font-bold text-gray-700 mb-1">出発日 (任意)：</label>
                     <input type="date" value={newTripDate} onChange={e => setNewTripDate(e.target.value)} className="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-400 focus:outline-none"/>
                  </div>
                </div>
                <div className="flex justify-end gap-2 shrink-0 pt-2 border-t">
                  <button onClick={() => setShowImportModal(false)} className="px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 rounded-lg">キャンセル</button>
                  <button onClick={handleImportPlan} disabled={isImporting || !importDataText.trim()} className="px-5 py-2 text-sm bg-indigo-600 text-white font-bold rounded-lg shadow hover:bg-indigo-700 disabled:opacity-50">
                    {isImporting ? '取り込み中...' : 'しおりを一括作成'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
