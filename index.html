<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Travel Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
  <div id="root"></div>

  <script type="text/babel">
    // ==========================================
    // 🔑 Supabaseの接続情報
    // ==========================================
    const SUPABASE_URL = 'https://xankyyjojztzubhvrfwx.supabase.co';
    const SUPABASE_KEY ='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhhbmt5eWpvanp0enViaHZyZnd4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwOTczMjQsImV4cCI6MjEwODY3MzMyNH0.XhjVO7tibCwP9T0RFsPYP5iBLKkx0X3ebxBqnYSIkFM';

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { useState, useEffect, useRef } = React;

    // 日ごとのテーマカラー定義（5日目以降はループ）
    const DAY_THEMES = [
      { badge: 'bg-blue-600 text-white', dot: 'bg-blue-500', line: 'border-blue-200', text: 'text-blue-600', light: 'bg-blue-50 border-blue-200' },
      { badge: 'bg-emerald-600 text-white', dot: 'bg-emerald-500', line: 'border-emerald-200', text: 'text-emerald-600', light: 'bg-emerald-50 border-emerald-200' },
      { badge: 'bg-amber-500 text-white', dot: 'bg-amber-500', line: 'border-amber-200', text: 'text-amber-600', light: 'bg-amber-50 border-amber-200' },
      { badge: 'bg-purple-600 text-white', dot: 'bg-purple-500', line: 'border-purple-200', text: 'text-purple-600', light: 'bg-purple-50 border-purple-200' },
      { badge: 'bg-rose-500 text-white', dot: 'bg-rose-500', line: 'border-rose-200', text: 'text-rose-600', light: 'bg-rose-50 border-rose-200' }
    ];

    const getDayTheme = (dayNum) => DAY_THEMES[(Math.max(1, dayNum) - 1) % DAY_THEMES.length];

    // AIへの指示文（day対応版）
    const GEMINI_PROMPT_TEMPLATE = `これまでの旅行相談の内容をもとに、旅行しおりアプリに取り込むためのデータを出力してください。
必ず以下のJSONフォーマットのみを出力してください。前後の挨拶や補足文は不要です。

{
  "title": "旅行タイトル（例: 沖縄3泊4日の家族旅行）",
  "schedules": [
    {"day": 1, "time": "10:00", "place": "那覇空港到着・レンタカー受取"},
    {"day": 1, "time": "13:00", "place": "美ら海水族館見学"},
    {"day": 2, "time": "09:30", "place": "古宇利大橋ドライブ"},
    {"day": 3, "time": "11:00", "place": "国際通りでお土産探し"}
  ],
  "items": [
    "着替え",
    "日焼け止め",
    "保険証",
    "スマホ充電器"
  ]
}`;

    // ==========================================
    // しおり詳細画面
    // ==========================================
    function TripDetail({ trip, onBack }) {
      const [activeTab, setActiveTab] = useState('schedule');
      const [schedules, setSchedules] = useState([]);
      const [items, setItems] = useState([]);
      const [memories, setMemories] = useState([]);
      
      const [newItem, setNewItem] = useState('');
      const [newSchedule, setNewSchedule] = useState({ day: 1, time: '', place: '' });
      const [uploading, setUploading] = useState(false);
      const fileInputRef = useRef(null);

      const [selectedImage, setSelectedImage] = useState(null);
      const [editingScheduleId, setEditingScheduleId] = useState(null);
      const [editScheduleData, setEditScheduleData] = useState({ day: 1, time: '', place: '' });

      useEffect(() => {
        fetchData();
      }, [activeTab]);

      const fetchData = async () => {
        if (activeTab === 'schedule') {
          const { data } = await supabase
            .from('schedules')
            .select('*')
            .eq('trip_id', trip.id)
            .order('day', { ascending: true })
            .order('time', { ascending: true });
          setSchedules(data || []);
        } else if (activeTab === 'items') {
          const { data } = await supabase.from('items').select('*').eq('trip_id', trip.id).order('created_at', { ascending: true });
          setItems(data || []);
        } else if (activeTab === 'memories') {
          const { data } = await supabase.from('memories').select('*').eq('trip_id', trip.id).order('created_at', { ascending: false });
          setMemories(data || []);
        }
      };

      // --- 持ち物 ---
      const handleAddItem = async (e) => {
        e.preventDefault();
        if (!newItem) return;
        await supabase.from('items').insert([{ trip_id: trip.id, name: newItem }]);
        setNewItem('');
        fetchData();
      };

      const toggleItem = async (id, currentStatus) => {
        await supabase.from('items').update({ is_checked: !currentStatus }).eq('id', id);
        fetchData();
      };

      // --- 日程表 ---
      const handleAddSchedule = async (e) => {
        e.preventDefault();
        if (!newSchedule.place) return;
        await supabase.from('schedules').insert([{ 
          trip_id: trip.id, 
          day: Number(newSchedule.day) || 1,
          time: newSchedule.time,
          place: newSchedule.place 
        }]);
        setNewSchedule({ ...newSchedule, time: '', place: '' });
        fetchData();
      };

      const deleteSchedule = async (id) => {
        if(confirm('この予定を削除しますか？')) {
          await supabase.from('schedules').delete().eq('id', id);
          fetchData();
        }
      };

      const handleUpdateSchedule = async (id) => {
        if (!editScheduleData.place) return;
        await supabase.from('schedules').update({
          day: Number(editScheduleData.day) || 1,
          time: editScheduleData.time,
          place: editScheduleData.place
        }).eq('id', id);
        setEditingScheduleId(null);
        fetchData();
      };

      // --- 写真アップロード ---
      const handleImageUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        const fileName = `${Date.now()}.${file.name.split('.').pop()}`;
        const { error: uploadError } = await supabase.storage.from('trip-photos').upload(fileName, file);
        if (uploadError) {
          alert('アップロード失敗: ' + uploadError.message);
          setUploading(false);
          return;
        }
        const { data: { publicUrl } } = supabase.storage.from('trip-photos').getPublicUrl(fileName);
        await supabase.from('memories').insert([{ trip_id: trip.id, image_url: publicUrl }]);
        setUploading(false);
        fetchData();
      };

      const handleShare = () => {
        if (navigator.share) {
          navigator.share({ title: trip.title, text: '家族旅行のしおりです！', url: window.location.href })
            .catch(console.error);
        } else {
          navigator.clipboard.writeText(window.location.href);
          alert('URLをコピーしました！LINEなどに貼り付けて共有できます。');
        }
      };

      const copyGeminiPrompt = () => {
        navigator.clipboard.writeText(GEMINI_PROMPT_TEMPLATE);
        alert('Geminiへの指示文をコピーしました！Geminiに送ってください。');
      };

      // スケジュールを「day」ごとにグループ分け
      const groupedSchedules = schedules.reduce((acc, sch) => {
        const d = sch.day || 1;
        if (!acc[d]) acc[d] = [];
        acc[d].push(sch);
        return acc;
      }, {});

      return (
        <div className="max-w-4xl mx-auto bg-white h-[100dvh] flex flex-col shadow-xl">
          <div className="bg-gradient-to-r from-blue-500 to-indigo-500 text-white p-4 flex items-center justify-between shrink-0">
            <button onClick={onBack} className="hover:bg-white/20 p-2 rounded-full"><i className="fa-solid fa-chevron-left text-xl"></i></button>
            <h1 className="text-lg font-bold truncate">{trip.title}</h1>
            <button onClick={handleShare} className="hover:bg-white/20 p-2 rounded-full" title="家族に共有する"><i className="fa-solid fa-share-nodes text-xl"></i></button>
          </div>

          <div className="flex border-b text-sm font-medium bg-white shrink-0">
            {[
              { id: 'schedule', icon: 'fa-calendar-days', label: '日程' },
              { id: 'items', icon: 'fa-suitcase', label: '持ち物' },
              { id: 'memories', icon: 'fa-image', label: '思い出' },
              { id: 'ai', icon: 'fa-wand-magic-sparkles', label: 'AI連携' }
            ].map(tab => (
              <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex-1 py-3 text-center transition ${activeTab === tab.id ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-500 hover:bg-gray-50'}`}>
                <i className={`fa-solid ${tab.icon} block mb-1 text-lg`}></i>{tab.label}
              </button>
            ))}
          </div>

          <div className="flex-1 overflow-y-auto bg-gray-50 p-4">
            
            {/* 1. 日程タブ（日別カラー＆グループ表示） */}
            {activeTab === 'schedule' && (
              <div className="max-w-xl mx-auto pb-6 space-y-6">
                
                {/* 予定追加フォーム */}
                <form onSubmit={handleAddSchedule} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-2">
                  <div className="flex items-center gap-1 bg-gray-50 border rounded-lg px-2 py-1">
                    <span className="text-xs text-gray-500 font-bold">第</span>
                    <select 
                      value={newSchedule.day} 
                      onChange={e => setNewSchedule({...newSchedule, day: e.target.value})}
                      className="bg-transparent font-bold text-sm focus:outline-none"
                    >
                      {[1,2,3,4,5,6,7].map(d => (
                        <option key={d} value={d}>{d}</option>
                      ))}
                    </select>
                    <span className="text-xs text-gray-500 font-bold">日</span>
                  </div>
                  <input 
                    type="time" 
                    value={newSchedule.time} 
                    onChange={e => setNewSchedule({...newSchedule, time: e.target.value})} 
                    className="border rounded-lg p-2 text-sm" 
                  />
                  <input 
                    type="text" 
                    placeholder="場所・予定を入力" 
                    value={newSchedule.place} 
                    onChange={e => setNewSchedule({...newSchedule, place: e.target.value})} 
                    className="border rounded-lg p-2 text-sm flex-1 min-w-[140px]" 
                    required 
                  />
                  <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-blue-700">
                    <i className="fa-solid fa-plus"></i>
                  </button>
                </form>

                {/* 日別のタイムライン */}
                {Object.keys(groupedSchedules).length > 0 ? (
                  Object.keys(groupedSchedules).sort((a,b) => Number(a) - Number(b)).map(dayKey => {
                    const dayNum = Number(dayKey);
                    const theme = getDayTheme(dayNum);
                    const daySchedules = groupedSchedules[dayKey];

                    return (
                      <div key={dayKey} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
                        {/* 日付見出しバッジ */}
                        <div className="flex items-center gap-2 mb-4 pb-2 border-b">
                          <span className={`${theme.badge} text-xs font-bold px-3 py-1 rounded-full shadow-sm`}>
                            {dayNum}日目
                          </span>
                          <span className="text-xs text-gray-400 font-bold">DAY {dayNum}</span>
                        </div>

                        {/* その日の予定一覧 */}
                        <div className={`relative border-l-2 ${theme.line} ml-3 space-y-4`}>
                          {daySchedules.map(sch => (
                            <div key={sch.id} className="relative pl-5">
                              {/* 日ごとに色の変わる丸マーカー */}
                              <div className={`absolute -left-[7px] top-3.5 w-3 h-3 rounded-full ${theme.dot} ring-4 ring-white`}></div>
                              
                              <div className="bg-gray-50 hover:bg-gray-100 transition p-3 rounded-xl border border-gray-100">
                                {editingScheduleId === sch.id ? (
                                  <div className="flex flex-col gap-2">
                                    <div className="flex gap-2">
                                      <select 
                                        value={editScheduleData.day} 
                                        onChange={e => setEditScheduleData({...editScheduleData, day: e.target.value})}
                                        className="border rounded p-1 text-xs"
                                      >
                                        {[1,2,3,4,5,6,7].map(d => (
                                          <option key={d} value={d}>{d}日目</option>
                                        ))}
                                      </select>
                                      <input 
                                        type="time" 
                                        value={editScheduleData.time} 
                                        onChange={e => setEditScheduleData({...editScheduleData, time: e.target.value})} 
                                        className="border rounded p-1 text-xs" 
                                      />
                                    </div>
                                    <input 
                                      type="text" 
                                      value={editScheduleData.place} 
                                      onChange={e => setEditScheduleData({...editScheduleData, place: e.target.value})} 
                                      className="border rounded p-1 text-sm" 
                                    />
                                    <div className="flex justify-end gap-2 mt-1">
                                      <button onClick={() => setEditingScheduleId(null)} className="text-xs text-gray-500 px-3 py-1 bg-white border rounded">キャンセル</button>
                                      <button onClick={() => handleUpdateSchedule(sch.id)} className="text-xs text-white px-3 py-1 bg-blue-600 rounded font-bold">更新</button>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="flex justify-between items-start">
                                    <div>
                                      <span className={`${theme.text} font-bold text-xs`}>{sch.time || '時間未定'}</span>
                                      <h3 className="font-bold text-gray-800 text-sm mt-0.5">{sch.place}</h3>
                                    </div>
                                    <div className="flex gap-3 text-gray-400 text-xs mt-1">
                                      <button onClick={() => { setEditingScheduleId(sch.id); setEditScheduleData({ day: sch.day || 1, time: sch.time, place: sch.place }); }}>
                                        <i className="fa-solid fa-pen hover:text-gray-600"></i>
                                      </button>
                                      <button onClick={() => deleteSchedule(sch.id)} className="hover:text-red-500">
                                        <i className="fa-solid fa-trash"></i>
                                      </button>
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })
                ) : (
                  <p className="text-gray-400 text-center py-10">予定がまだありません。<br/>上のフォームから追加してください。</p>
                )}
              </div>
            )}

            {/* 2. 持ち物タブ */}
            {activeTab === 'items' && (
              <div className="max-w-xl mx-auto space-y-4 pb-6">
                <form onSubmit={handleAddItem} className="flex gap-2">
                  <input type="text" placeholder="持ち物を追加" value={newItem} onChange={e => setNewItem(e.target.value)} className="flex-1 border rounded-lg px-4 py-3 text-sm" />
                  <button type="submit" className="bg-blue-600 text-white px-5 rounded-lg font-bold text-sm">追加</button>
                </form>
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                  {items.map(item => (
                    <div key={item.id} onClick={() => toggleItem(item.id, item.is_checked)} className="flex items-center p-4 border-b last:border-b-0 cursor-pointer hover:bg-gray-50">
                      <div className={`w-6 h-6 rounded-full flex items-center justify-center mr-3 border ${item.is_checked ? 'bg-green-500 border-green-500 text-white' : 'border-gray-300'}`}>
                        {item.is_checked && <i className="fa-solid fa-check text-xs"></i>}
                      </div>
                      <span className={`flex-1 text-sm ${item.is_checked ? 'text-gray-400 line-through' : 'text-gray-800'}`}>{item.name}</span>
                    </div>
                  ))}
                  {items.length === 0 && <p className="text-gray-400 text-center py-6 text-sm">持ち物がありません</p>}
                </div>
              </div>
            )}

            {/* 3. 思い出タブ */}
            {activeTab === 'memories' && (
              <div className="space-y-4 pb-6">
                <div className="text-center mb-6">
                  <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImageUpload} className="hidden" />
                  <button onClick={() => fileInputRef.current.click()} disabled={uploading} className="bg-blue-600 text-white px-6 py-3 rounded-full font-bold shadow-lg">
                    <i className="fa-solid fa-camera mr-2"></i> {uploading ? 'アップロード中...' : '写真を追加'}
                  </button>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                  {memories.map(mem => (
                    <div key={mem.id} onClick={() => setSelectedImage(mem.image_url)} className="aspect-square bg-gray-200 rounded-lg overflow-hidden cursor-pointer hover:opacity-80 transition">
                      <img src={mem.image_url} alt="思い出" className="w-full h-full object-cover" />
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* 4. AI連携タブ */}
            {activeTab === 'ai' && (
              <div className="max-w-xl mx-auto space-y-4 pb-6">
                <div className="bg-indigo-50 border border-indigo-100 rounded-xl p-4 text-sm text-indigo-900 leading-relaxed">
                  <h3 className="font-bold mb-2 flex items-center gap-2 text-indigo-700">
                    <i className="fa-solid fa-lightbulb"></i> Geminiでプランを練る方法
                  </h3>
                  <ol className="list-decimal list-inside space-y-1 text-xs text-indigo-800">
                    <li>Geminiを開いて旅行プランを相談する</li>
                    <li>「指示文をコピー」を押してGeminiに送る（1日目・2日目も自動判別！）</li>
                    <li>返ってきたコードを一覧画面の「AIプラン取込」に貼るだけ！</li>
                  </ol>
                </div>

                <div className="space-y-3">
                  <button onClick={copyGeminiPrompt} className="w-full bg-indigo-600 text-white font-bold p-3 rounded-xl shadow hover:bg-indigo-700 transition flex items-center justify-center gap-2">
                    <i className="fa-solid fa-copy"></i> Gemini用の取り込み指示文をコピー
                  </button>

                  <a href="https://gemini.google.com/app" target="_blank" className="block bg-white p-4 rounded-xl shadow-sm border border-gray-200 hover:shadow-md transition text-center flex items-center justify-center gap-3">
                    <i className="fa-brands fa-google text-2xl text-blue-500"></i>
                    <div className="text-left">
                      <div className="font-bold text-gray-800">Google Gemini を開く</div>
                      <div className="text-xs text-gray-500">相談・プラン作成はこちら</div>
                    </div>
                  </a>
                </div>
              </div>
            )}
          </div>
          
          {selectedImage && (
            <div className="fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4" onClick={() => setSelectedImage(null)}>
              <img src={selectedImage} alt="拡大" className="max-w-full max-h-full object-contain" />
              <button className="absolute top-4 right-4 text-white text-3xl p-4"><i className="fa-solid fa-xmark"></i></button>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // メイン（一覧画面 ＆ AIプラン取込）
    // ==========================================
    function App() {
      const [trips, setTrips] = useState([]);
      const [currentTrip, setCurrentTrip] = useState(null);
      const [newTripTitle, setNewTripTitle] = useState('');
      const [showImportModal, setShowImportModal] = useState(false);
      const [importDataText, setImportDataText] = useState('');
      const [isImporting, setIsImporting] = useState(false);

      useEffect(() => {
        fetchTrips();
      }, []);

      const fetchTrips = async () => {
        const { data } = await supabase.from('trips').select('*').order('created_at', { ascending: false });
        setTrips(data || []);
      };

      const addTrip = async (e) => {
        e.preventDefault();
        if (!newTripTitle) return;
        await supabase.from('trips').insert([{ title: newTripTitle }]);
        setNewTripTitle('');
        fetchTrips();
      };

      const handleImportPlan = async () => {
        if (!importDataText.trim()) return;
        setIsImporting(true);

        try {
          const jsonMatch = importDataText.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error('有効なデータが見つかりませんでした。');
          const parsed = JSON.parse(jsonMatch[0]);
          if (!parsed.title) throw new Error('旅行タイトルが含まれていません。');

          const { data: tripData, error: tripErr } = await supabase
            .from('trips')
            .insert([{ title: parsed.title }])
            .select()
            .single();

          if (tripErr) throw tripErr;

          const tripId = tripData.id;

          // 日程の一括登録（dayにも対応）
          if (parsed.schedules && parsed.schedules.length > 0) {
            const scheduleRecords = parsed.schedules.map(s => ({
              trip_id: tripId,
              day: Number(s.day) || 1,
              time: s.time || '',
              place: s.place || ''
            }));
            await supabase.from('schedules').insert(scheduleRecords);
          }

          // 持ち物の一括登録
          if (parsed.items && parsed.items.length > 0) {
            const itemRecords = parsed.items.map(name => ({
              trip_id: tripId,
              name: typeof name === 'string' ? name : (name.name || ''),
              is_checked: false
            }));
            await supabase.from('items').insert(itemRecords);
          }

          alert(`「${parsed.title}」のしおりを作成しました！`);
          setImportDataText('');
          setShowImportModal(false);
          await fetchTrips();
          setCurrentTrip(tripData);
        } catch (err) {
          alert('取り込みに失敗しました: ' + err.message);
        } finally {
          setIsImporting(false);
        }
      };

      const copyGeminiPrompt = () => {
        navigator.clipboard.writeText(GEMINI_PROMPT_TEMPLATE);
        alert('Geminiへの指示文をコピーしました！Geminiに送ってください。');
      };

      if (currentTrip) return <TripDetail trip={currentTrip} onBack={() => setCurrentTrip(null)} />;

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-8">
          <div className="flex items-center justify-between mb-8">
            <h1 className="text-2xl font-bold text-gray-800">
              <i className="fa-solid fa-plane-departure text-blue-600 mr-2"></i> 家族の旅行一覧
            </h1>
            <button 
              onClick={() => setShowImportModal(true)} 
              className="bg-indigo-600 text-white text-sm font-bold px-4 py-2 rounded-xl shadow hover:bg-indigo-700 transition flex items-center gap-2"
            >
              <i className="fa-solid fa-wand-magic-sparkles"></i> AIプラン取込
            </button>
          </div>

          <form onSubmit={addTrip} className="bg-white p-4 rounded-xl shadow-sm mb-8 flex gap-2">
            <input type="text" placeholder="手動で旅行を追加 (例: 沖縄旅行)" className="flex-1 border rounded-lg px-4 py-2" value={newTripTitle} onChange={e => setNewTripTitle(e.target.value)} />
            <button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold">追加</button>
          </form>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {trips.map(trip => (
              <div key={trip.id} onClick={() => setCurrentTrip(trip)} className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-blue-500 cursor-pointer hover:shadow-md transition">
                <h2 className="text-xl font-bold mb-2">{trip.title}</h2>
                <div className="mt-4 text-right text-blue-600 text-sm font-bold">しおりを開く →</div>
              </div>
            ))}
          </div>

          {showImportModal && (
            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 max-h-[90vh] flex flex-col">
                <div className="flex justify-between items-center shrink-0">
                  <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i className="fa-solid fa-wand-magic-sparkles text-indigo-600"></i> AIプラン取り込み
                  </h2>
                  <button onClick={() => setShowImportModal(false)} className="text-gray-400 hover:text-gray-600 text-xl">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto space-y-3 text-sm">
                  <div className="bg-gray-50 border p-3 rounded-lg text-gray-600 space-y-2">
                    <p className="font-bold text-gray-700">取り込み手順：</p>
                    <ol className="list-decimal list-inside space-y-1 text-xs">
                      <li>Geminiで旅行の相談をする</li>
                      <li>下のボタンで指示文をコピーしてGeminiに送る</li>
                      <li>Geminiが返したJSONコードを貼り付ける</li>
                    </ol>
                    <div className="pt-1 flex gap-2">
                      <button onClick={copyGeminiPrompt} className="text-xs bg-indigo-100 text-indigo-700 font-bold px-3 py-1.5 rounded hover:bg-indigo-200">
                        <i className="fa-solid fa-copy mr-1"></i> 指示文をコピー
                      </button>
                      <a href="https://gemini.google.com/app" target="_blank" className="text-xs bg-gray-200 text-gray-700 font-bold px-3 py-1.5 rounded hover:bg-gray-300">
                        Geminiを開く ↗
                      </a>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-700 mb-1">Geminiの返答コードを貼り付け：</label>
                    <textarea 
                      rows="6"
                      value={importDataText}
                      onChange={e => setImportDataText(e.target.value)}
                      placeholder='{"title": "沖縄3泊4日", "schedules": [{"day": 1, "time": "10:00", "place": "..."}], ...}'
                      className="w-full border rounded-lg p-2.5 text-xs font-mono focus:ring-2 focus:ring-indigo-400 focus:outline-none"
                    ></textarea>
                  </div>
                </div>

                <div className="flex justify-end gap-2 shrink-0 pt-2 border-t">
                  <button onClick={() => setShowImportModal(false)} className="px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 rounded-lg">キャンセル</button>
                  <button 
                    onClick={handleImportPlan} 
                    disabled={isImporting || !importDataText.trim()} 
                    className="px-5 py-2 text-sm bg-indigo-600 text-white font-bold rounded-lg shadow hover:bg-indigo-700 disabled:opacity-50"
                  >
                    {isImporting ? '取り込み中...' : 'しおりを一括作成'}
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
